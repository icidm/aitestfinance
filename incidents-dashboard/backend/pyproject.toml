[project]
name = "incidents-dashboard"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.104.0",
  "uvicorn[standard]>=0.24.0",
  "python-pptx>=0.6.21",
  "SQLAlchemy==2.0.36",
  "asyncpg==0.30.0",
  "aiosqlite==0.21.0",
  "psycopg2-binary==2.9.10",
  "alembic==1.14.1",
  "pydantic-settings==2.7.0",
  "python-jose[cryptography]==3.3.0",
  "passlib[bcrypt]==1.7.4",
  "python-multipart==0.0.9",
  "prometheus-fastapi-instrumentator==6.1.0",
  "prometheus-client==0.21.0",
  "python-json-logger==2.0.7",
  "WeasyPrint==62.3",
  "Jinja2==3.1.4",
  "APScheduler==3.10.4"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disable_error_code = "valid-type, misc, attr-defined, assignment, operator, arg-type, return, import-untyped, import-not-found, no-redef, func-returns-value"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["*/schemas.py", "*/seed.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
